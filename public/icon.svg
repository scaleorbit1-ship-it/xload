<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glass Rim Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)" />
      <stop offset="40%" stop-color="rgba(56, 189, 248, 0.25)" />
      <stop offset="100%" stop-color="rgba(29, 155, 240, 0.1)" />
    </linearGradient>

    <!-- Electric Cyan Beam -->
    <linearGradient id="beam1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d9bf0" />
    </linearGradient>

    <!-- Emerald Flow Beam -->
    <linearGradient id="beam2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="40%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Liquid Specular Sheen -->
    <linearGradient id="liquidSheen" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.35)" />
      <stop offset="60%" stop-color="rgba(255, 255, 255, 0.03)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Glass Effect -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="6" />
  
  <!-- Subtle Internal Radial Glow -->
  <circle cx="256" cy="230" r="160" fill="#1d9bf0" opacity="0.15" filter="url(#glow)" />

  <!-- Liquid Glass Upper Hemisphere Reflection -->
  <path d="M 28 152 C 28 84 84 28 152 28 L 360 28 C 428 28 484 84 484 152 C 484 220 376 260 256 260 C 136 260 28 220 28 152 Z" fill="url(#liquidSheen)" />

  <!-- Stylized Geometric "X" with Integrated Velocity Down Arrow -->
  <!-- Diagonal 1: Top-Left to Bottom-Right Anchor -->
  <path d="M 148 140 L 222 238 L 180 292 L 116 208 C 108 198 108 184 116 174 L 134 150 C 138 144 142 140 148 140 Z" fill="url(#beam1)" opacity="0.9" />
  <path d="M 332 372 L 258 274 L 300 220 L 364 304 C 372 314 372 328 364 338 L 346 362 C 342 368 338 372 332 372 Z" fill="url(#beam1)" opacity="0.9" />

  <!-- Diagonal 2 + Download Arrow Head: Top-Right descending through center into downward arrow -->
  <path d="M 364 140 C 370 140 376 144 380 150 L 396 174 C 404 184 404 198 396 208 L 296 338 L 296 294 L 216 190 C 208 180 208 166 216 156 L 234 134 C 242 124 256 124 266 134 L 324 208 L 350 146 C 352 142 358 140 364 140 Z" fill="url(#beam2)" />

  <!-- Dynamic Center Downward Arrow Core -->
  <path d="M 236 180 L 276 180 C 282 180 288 186 288 192 L 288 296 L 330 296 C 340 296 345 308 338 316 L 264 394 C 259 399 253 399 248 394 L 174 316 C 167 308 172 296 182 296 L 224 296 L 224 192 C 224 186 230 180 236 180 Z" fill="url(#beam1)" filter="url(#glow)" />

  <!-- Precision Tip Highlight -->
  <circle cx="256" cy="386" r="6" fill="#ffffff" />
</svg>
